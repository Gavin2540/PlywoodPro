# Builds the Windows .exe on GitHub's Windows machines, so releases can be made from a Mac.
#
#   Test build:  push to the v2 branch, or GitHub > Actions > "Build Windows app" > Run workflow
#                (download the .exe from the run's Artifacts; nothing is published)
#   Release:     set CURRENT_VERSION in utils/updater.py, commit, then
#                git tag v2.0.0 && git push origin v2.0.0
#                -> tests run, the .exe is built, zipped and published as a GitHub Release.
#                   Installed copies of the app pick it up through the auto-updater.
name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]          # a version tag builds AND publishes a release
    branches: ["v2"]      # a push to v2 only builds a test .exe (no release)

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          # Qt can crash while Python shuts down after the tests, which gives a failing exit code
          # even when every test passed. The verdict is therefore read from the results file.
          python -m pytest -q --junitxml=test-results.xml
          Write-Host "pytest exit code: $LASTEXITCODE"
          if (-not (Test-Path test-results.xml)) { throw "The tests did not finish (no results file)" }
          $suite = ([xml](Get-Content test-results.xml)).SelectSingleNode("//testsuite")
          Write-Host "tests=$($suite.tests) failures=$($suite.failures) errors=$($suite.errors)"
          if ([int]$suite.tests -lt 100) { throw "Too few tests ran" }
          if ([int]$suite.failures -ne 0 -or [int]$suite.errors -ne 0) { throw "Tests failed" }
          $global:LASTEXITCODE = 0
          exit 0
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          app=$(python -c "from utils.updater import CURRENT_VERSION as v; print(v)")
          if [ "v$app" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match CURRENT_VERSION $app in utils/updater.py"; exit 1
          fi
      - name: Build
        run: python tools/build.py
      - name: Self-test the built .exe (opens every screen, saves a sale, writes PDF/Excel/backup)
        shell: pwsh
        run: |
          # A windowed .exe gives PowerShell no dependable exit code, so the verdict is read from the log it writes.
          Get-ChildItem "$env:TEMP" -Filter "plywoodpro-selftest-*" -Directory | Remove-Item -Recurse -Force
          Start-Process -FilePath "dist/Plywood Pro.exe" -ArgumentList "--selftest" -Wait
          $log = Get-ChildItem "$env:TEMP" -Filter "plywoodpro-selftest-*" -Directory | ForEach-Object { Join-Path $_.FullName "selftest.log" } | Select-Object -First 1
          if (-not $log -or -not (Test-Path $log)) { throw "The .exe did not start or wrote no self-test log" }
          Get-Content $log
          if (-not (Select-String -Path $log -Pattern "^SELFTEST PASSED$" -Quiet)) { throw "Self-test failed" }
      - name: Package
        shell: pwsh
        run: |
          $v = python -c "from utils.updater import CURRENT_VERSION as v; print(v)"
          $zip = "PlywoodPro_v$v.zip"
          Compress-Archive -Path "dist/Plywood Pro.exe" -DestinationPath $zip -Force
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" | Out-File -Encoding ascii "$zip.sha256"
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/upload-artifact@v4
        with:
          name: PlywoodPro-windows
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
            dist/Plywood Pro.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
          generate_release_notes: true
